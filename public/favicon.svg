<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Parley mark from the deck: an eight-lobed rosette drawn as an outline (a lobed shape minus a smaller copy of itself) -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b84ff"/><stop offset=".5" stop-color="#6b6cf6"/><stop offset="1" stop-color="#3f8df5"/></linearGradient>
    <g id="r">
      <circle cx="16" cy="16" r="9.6"/>
      <circle cx="16" cy="6.4" r="4.6"/><circle cx="22.79" cy="9.21" r="4.6"/><circle cx="25.6" cy="16" r="4.6"/><circle cx="22.79" cy="22.79" r="4.6"/>
      <circle cx="16" cy="25.6" r="4.6"/><circle cx="9.21" cy="22.79" r="4.6"/><circle cx="6.4" cy="16" r="4.6"/><circle cx="9.21" cy="9.21" r="4.6"/>
    </g>
    <mask id="m"><rect width="32" height="32" fill="#fff"/><use href="#r" fill="#000" transform="translate(16 16) scale(.8) translate(-16 -16)"/></mask>
  </defs>
  <use href="#r" fill="url(#g)" mask="url(#m)"/>
</svg>
