<!doctype html><html><head><meta charset="utf-8"><title>Slide 7 layouts</title>
<style>body{margin:0;background:#05060c;font-family:Helvetica,Arial,sans-serif;color:#f4f5fb}
#cs{display:grid;grid-template-columns:repeat(2,960px);gap:40px;padding:40px;width:max-content}
#cs figure{margin:0} #cs img{width:960px;display:block;border:1px solid #262a40}
#cs figcaption{font-size:40px;font-weight:800;margin:0 0 10px}</style></head>
<body><div id="cs">
<figure><figcaption>A</figcaption><img src="L1.png"></figure><figure><figcaption>B</figcaption><img src="L2.png"></figure>
<figure><figcaption>C</figcaption><img src="L3.png"></figure><figure><figcaption>D</figcaption><img src="L4.png"></figure>
<figure><figcaption>E</figcaption><img src="L5.png"></figure></div></body></html>
