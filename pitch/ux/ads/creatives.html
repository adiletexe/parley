<!doctype html><html><head><meta charset="utf-8"><title>Parley ads</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@600;700&family=Courier+Prime:wght@400;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="creatives.css">
<style>body{margin:0;background:#0d0e1a;font-family:"Plus Jakarta Sans",sans-serif;color:#a9abc0}
#sheet{display:grid;grid-template-columns:repeat(4,400px);gap:36px 32px;padding:48px;width:max-content}
#sheet figure{margin:0} #sheet figcaption{font-size:20px;font-weight:700;margin-top:12px}</style></head>
<body><div id="sheet"></div>
<script>document.getElementById('sheet').innerHTML=[1,2,3,4,5,6,7,8].map(i=>`<figure><div data-ad="${i}"></div><figcaption>${i}</figcaption></figure>`).join('')</script>
<script src="creatives.js"></script></body></html>
